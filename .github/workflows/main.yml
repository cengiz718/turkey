name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project directory and build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadi!"
            exit 1
          fi
          echo "Proje dizini bulundu: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurkeyGuide-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
